<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>Stride</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-screen" id="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">Stride</div>
      <p class="auth-tagline">Your work. Refined.</p>
      <button class="auth-google-btn" id="google-signin-btn">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#34A853" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#FBBC05" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <div class="intro" id="intro">
    <div class="intro-logo">Stride</div>
    <div class="intro-tagline">Your work. Refined.</div>
  </div>

  <div class="app hidden" id="app">
    <header class="app-header">
      <h1 class="app-title">Stride</h1>
      <div class="header-actions">
        <div class="search-wrapper" id="search-wrapper">
          <input type="text" class="search-input" id="search-input" placeholder="Search..." />
          <div class="search-results" id="search-results"></div>
        </div>
        <button class="header-action-btn" id="export-btn" title="Export as Markdown">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <div class="user-profile hidden" id="user-profile">
          <img class="user-avatar" src="" alt="" />
          <span class="user-name"></span>
          <button class="header-action-btn" id="sign-out-btn" title="Sign out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </header>

    <nav class="tab-bar">
      <div class="tab-indicator" id="tab-indicator"></div>
      <button class="tab active" data-tab="tasks">Tasks</button>
      <button class="tab" data-tab="ideas">Ideas</button>
      <button class="tab" data-tab="principles">Principles</button>
      <button class="tab" data-tab="vision">Vision</button>
      <button class="tab" data-tab="alignment">Alignment</button>
      <button class="tab" data-tab="docs">Docs</button>
    </nav>

    <main class="tab-content">
      <section id="tasks-panel" class="panel active">
        <div class="date-nav">
          <button class="date-btn" id="prev-day" aria-label="Previous day">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span class="date-display" id="current-date"></span>
          <button class="date-btn" id="next-day" aria-label="Next day">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <button class="date-btn today-btn" id="today-btn">Today</button>
        </div>

        <div id="carryover-banner" class="carryover-banner hidden"></div>
        <div id="focus-summary" class="focus-summary"></div>

        <div class="toggle-row">
          <button class="summary-toggle" id="summary-toggle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
            Weekly Summary & Review
          </button>
          <button class="summary-toggle" id="unfinished-toggle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            Unfinished Tasks
          </button>
        </div>
        <div id="unfinished-view" class="summary-view hidden"></div>
        <div id="summary-view" class="summary-view hidden"></div>
        <div id="tasks-list" class="item-list"></div>
        <div class="add-bar">
          <input type="text" id="task-input" class="add-input" placeholder="What do you need to do?" />
          <button class="add-btn" id="add-task-btn" aria-label="Add task">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </section>

      <section id="ideas-panel" class="panel">
        <div class="panel-header panel-header-inline">
          <label class="toggle-label">
            <input type="checkbox" id="show-converted" />
            <span class="toggle-switch"></span>
            Show converted
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="show-archived" />
            <span class="toggle-switch"></span>
            Show archived
          </label>
        </div>
        <div id="ideas-list" class="item-list"></div>
        <div class="add-bar">
          <input type="text" id="idea-input" class="add-input" placeholder="What's on your mind?" />
          <button class="add-btn" id="add-idea-btn" aria-label="Add idea">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </section>

      <section id="principles-panel" class="panel">
        <div id="principles-list" class="item-list"></div>
        <div class="add-bar">
          <input type="text" id="principle-input" class="add-input" placeholder="What do you believe in?" />
          <button class="add-btn" id="add-principle-btn" aria-label="Add principle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </section>

      <section id="vision-panel" class="panel">
        <div id="vision-list" class="item-list"></div>
        <div class="add-bar vision-add-bar">
          <input type="text" id="vision-input" class="add-input" placeholder="Where do you see yourself?" />
          <select id="vision-horizon" class="horizon-select">
            <option value="">Horizon</option>
            <option value="3 months">3 months</option>
            <option value="6 months">6 months</option>
            <option value="1 year">1 year</option>
            <option value="3 years">3 years</option>
            <option value="5 years">5 years</option>
            <option value="7 years">7 years</option>
            <option value="10 years">10 years</option>
          </select>
          <input type="date" id="vision-target-date" class="horizon-date" title="Target date" />
          <button class="add-btn" id="add-vision-btn" aria-label="Add vision">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </section>

      <section id="alignment-panel" class="panel">
        <div id="alignment-root"></div>
      </section>

      <section id="docs-panel" class="panel">
        <div class="journal-header">
          <span class="journal-title">Journal</span>
          <div class="journal-actions">
            <span class="docs-save-status" id="docs-save-status"></span>
            <input type="date" class="docs-date-picker" id="docs-date-picker" title="Add entry for date" />
            <button class="date-btn" id="docs-download-btn" title="Download journal">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
          </div>
        </div>
        <div id="journal-entries" class="journal-entries"></div>
      </section>
    </main>
  </div>

  <div class="modal-overlay hidden" id="detail-modal">
    <div class="modal">
      <h3 class="modal-title" id="modal-title">Edit Details</h3>
      <input type="text" class="modal-input" id="modal-name" placeholder="Title" />
      <textarea class="modal-textarea" id="modal-details" placeholder="Add details or notes..."></textarea>

      <div class="modal-field hidden" id="modal-date-wrap">
        <label class="modal-label" for="modal-date">When</label>
        <input type="date" class="modal-input" id="modal-date" />
      </div>

      <div class="modal-field hidden" id="modal-horizon-wrap">
        <label class="modal-label" for="modal-horizon">Time horizon</label>
        <select class="modal-input modal-select" id="modal-horizon">
          <option value="">No horizon</option>
          <option value="3 months">3 months</option>
          <option value="6 months">6 months</option>
          <option value="1 year">1 year</option>
          <option value="3 years">3 years</option>
          <option value="5 years">5 years</option>
          <option value="7 years">7 years</option>
          <option value="10 years">10 years</option>
        </select>
      </div>

      <div class="modal-field hidden" id="modal-target-date-wrap">
        <label class="modal-label" for="modal-target-date">Target date</label>
        <input type="date" class="modal-input" id="modal-target-date" />
      </div>

      <div class="modal-grid hidden" id="modal-links-wrap">
        <div class="modal-field">
          <label class="modal-label" for="modal-principle">Principle</label>
          <select class="modal-input modal-select" id="modal-principle"></select>
        </div>
        <div class="modal-field">
          <label class="modal-label" for="modal-vision">Vision</label>
          <select class="modal-input modal-select" id="modal-vision"></select>
        </div>
      </div>

      <label class="modal-check hidden" id="modal-focus-wrap">
        <input type="checkbox" id="modal-focus" />
        Mark as one of today&apos;s focus tasks
      </label>

      <div class="modal-extra-actions hidden" id="modal-extra-actions"></div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button class="btn" id="modal-save">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="delete-modal">
    <div class="modal modal-small">
      <p class="delete-msg">Are you sure you want to delete this?</p>
      <p class="delete-submsg">This action can't be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="delete-cancel">Cancel</button>
        <button class="btn btn-danger" id="delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/tasks.js"></script>
  <script src="/js/ideas.js"></script>
  <script src="/js/principles.js"></script>
  <script src="/js/vision.js"></script>
  <script src="/js/alignment.js"></script>
  <script src="/js/docs.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('google-signin-btn').addEventListener('click', () => {
      window.Auth.signIn().catch((err) => {
        if (err.code !== 'auth/popup-closed-by-user') console.error(err);
      });
    });
  </script>
</body>
</html>
